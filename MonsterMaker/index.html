<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Maker</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  
    <div class="wrapper">
        <div class="buttons">
             <button id="face-btn">Face</button>
             <button id="color-btn">Colors</button>
             <button id="horns-btn">Horns</button>
             <button id="tail-btn">Face</button>
        </div>
        <div class="container">
            <div class="monster">
               <div class="monster-horns"></div>
               <div class="monster-tail"></div>
               <div class="monster-body">
                  <img src="face-0.png" id="face" />
               </div>
            </div>
        </div>
    </div>

   <script src="script.js"></script>

</body>
</html>
