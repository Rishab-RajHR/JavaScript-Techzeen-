<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Cards</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  
   <div class="container">
       <div class="filter-buttons">
           <button class="active" data-name="all">Show All</button>
           <button data-name="shoes">Shoes</button>
           <button data-name="phones">phones</button>
           <button data-name="headphones">Headphones</button>
       </div>

       <!-- Image Cards -->
        <div class="filterable-cards">
            <div class="card" data-name="phones">
                <img src="img/phone1.jpg" alt="">
                <div class="card-body">
                     <h6 class="card-title">Phones</h6>
                     <p class="card-text">
                        Smartphones can also access the internet and social media.
                     </p>
                </div>
            </div>
        </div>
   </div>

  <script src="index.js"></script>
</body>
</html>
